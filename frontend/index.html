<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelEase</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo-container">
            <div class="logo-icon" aria-hidden="true">
                <img src="assets/images/plane.png" alt="" />
            </div>
            <div class="logo-text">
                <span class="logo-brand">TRAVELEASE</span>
                <span class="logo-title">Panel de control</span>
            </div>
        </div>

        <nav class="menu">

            <button class="menu-item" data-page="home">
                Inicio
            </button>

            <button class="menu-item" data-page="servicios">
                Servicios
            </button>

            <button class="menu-item" data-page="paquetes">
                Paquete turistico
            </button>

            <button class="menu-item" data-page="reservas">
                Reserva
            </button>

            <button class="menu-item" data-page="clientes">
                Cliente
            </button>

        </nav>

    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">

            <h1 id="page-title">
                Inicio
            </h1>

        </header>

        <!-- CONTENEDOR DINÁMICO -->
        <section id="app-content">

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
